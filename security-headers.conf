# Shared security headers, included by nginx.conf.
#
# nginx inherits add_header directives only into blocks that define none of
# their own — a location with any add_header of its own (e.g. Cache-Control)
# silently drops every inherited header. So this file must be included in the
# server block AND in every location that sets any header. Keep new locations
# doing the same.
#
# Lives at /etc/nginx/security-headers.conf — deliberately NOT under
# /etc/nginx/conf.d/, which the stock nginx image auto-includes at http level.
add_header X-Frame-Options "DENY" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "no-referrer" always;
add_header Permissions-Policy "geolocation=(), microphone=(), camera=(), payment=()" always;
add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' https: data:; connect-src 'self' https: wss:; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'" always;
