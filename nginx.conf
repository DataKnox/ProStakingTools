server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    server_tokens off;

    # add_header is NOT inherited into any block that declares add_header of
    # its own, so the shared headers are re-included in every location below.
    include /etc/nginx/security-headers.conf;

    location / {
        include /etc/nginx/security-headers.conf;
        # SPA shell and other non-hashed files: always revalidate so deploys
        # (and security fixes) propagate immediately; 304s keep this cheap.
        add_header Cache-Control "no-cache" always;
        try_files $uri /index.html;
    }

    location ~* \.(?:js|css|png|jpg|jpeg|gif|svg|ico|woff2?)$ {
        include /etc/nginx/security-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }
}
